appId: com.aungheinminn.blindcode
productName: Blind Code
copyright: Copyright © 2026 Aungheinminn

directories:
  output: release

files:
  - out/**/*
  - package.json
  - "!**/*.map"

extraResources:
  - from: ../client/build
    to: client
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
      - "!.gitkeep"

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false

dmg:
  writeUpdateInfo: false
