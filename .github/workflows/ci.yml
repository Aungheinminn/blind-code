name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/blind_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Server typecheck
        run: bun run typecheck
      - name: Apply migrations to test database
        working-directory: apps/server
        run: DATABASE_URL=$TEST_DATABASE_URL bunx drizzle-kit migrate
      - name: Server tests
        working-directory: apps/server
        run: ENCRYPTION_KEY=$(openssl rand -base64 32) bun test
      - name: Migrations match schema
        working-directory: apps/server
        run: |
          bunx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "Schema changed without a migration. Run 'bun run db:generate' in apps/server and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Client svelte-check
        working-directory: apps/client
        run: bunx svelte-check --tsconfig ./tsconfig.json --threshold error
      - name: Client tests
        working-directory: apps/client
        run: bun test src
