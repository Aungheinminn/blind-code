name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Server typecheck
        run: bun run typecheck
      - name: Server tests
        working-directory: apps/server
        run: ENCRYPTION_KEY=$(openssl rand -base64 32) bun test
      - name: Migrations match schema
        working-directory: apps/server
        run: |
          bunx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "Schema changed without a migration. Run 'bun run db:generate' in apps/server and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Client svelte-check
        working-directory: apps/client
        run: bunx svelte-check --tsconfig ./tsconfig.json --threshold error
